<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{background:linear-gradient(140deg,#efebff,#c5bfff);font-family:system-ui,sans-serif}#map{display:none}.notice{position:absolute;top:14px;left:14px;right:14px;background:rgba(255,255,255,.95);z-index:1000;padding:12px;border-radius:14px;font-size:13px;color:#29224b;box-shadow:0 4px 20px #0002}#fallback{padding:45px 28px;color:#3c326b;text-align:center;font-size:19px;line-height:1.8}.corner{position:absolute;bottom:14px;left:14px;z-index:1000;background:#fff;padding:8px 11px;border-radius:12px;font-size:12px;color:#342c55}</style></head><body>
<div id="map"></div><div id="fallback">지도 연결을 확인하고 있어요…<br><small>인터넷이 없으면 지도 미리보기를 표시할 수 없습니다.<br>실제 길 안내는 Pleos 내비에서 계속하세요.</small></div>
<div class="notice"><b>지도 미리보기 · OpenStreetMap</b><br>지도를 누르면 목적지 좌표를 선택할 수 있어요. <b>Pleos 원본 지도가 아니며 경로 안내가 아닙니다.</b></div><div class="corner">지도 데이터 © OpenStreetMap 기여자</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){function boot(){if(!window.L){document.getElementById('fallback').innerHTML='지도 네트워크 연결을 확인해 주세요.<br>실제 경로는 Pleos 내비에서 안내합니다.';return}document.getElementById('map').style.display='block';document.getElementById('fallback').style.display='none';window.restMap=L.map('map',{zoomControl:true,attributionControl:true}).setView([37.296,126.839],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(restMap);restMap.on('click',function(e){try{RestSyncMap.selectCoordinate(e.latlng.lat,e.latlng.lng)}catch(_){}});if(window.pendingDestination){var p=window.pendingDestination;window.setRestDestination(p.lat,p.lon,p.name)}}window.setRestDestination=function(lat,lon,name){if(!window.restMap){window.pendingDestination={lat:lat,lon:lon,name:name};return}if(window.pin){restMap.removeLayer(window.pin)}window.pin=L.marker([lat,lon]).addTo(restMap).bindPopup(name);restMap.setView([lat,lon],12)};boot()})();
</script></body></html>
